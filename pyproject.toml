[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mlx"
version = "0.1.0"
description = "Evidence-gated, declarative MLX tuning contracts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
inference = [
    "mlx==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers==5.16.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tokenizers==0.23.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "safetensors==0.8.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
auto-mlx = "auto_mlx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"auto_mlx.schemas" = ["*.json"]

[tool.unittest]
testpaths = ["tests"]
