name: ci

on:
  push:
  pull_request:

jobs:
  offline-unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile the standard-library package
        run: python -m py_compile src/auto_mlx/*.py tests/*.py
      - name: Run offline unittest suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
